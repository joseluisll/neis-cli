spring:
  application:
    name: neis
  ai:
    mcp:
      server:
        # US-18.3 (issue #118): the MCP server driving adapter over
        # Streamable HTTP. GATED on the server run mode via placeholder —
        # one-shot CLI invocations never boot MCP (and CLI mode has no
        # servlet machinery for the WebMVC transport anyway). The
        # endpoint rides the SAME RemoteAuthFilter chain as /api/*
        # (the single future auth attach point) and honors
        # neis.server.bind/port through the shared Tomcat.
        enabled: ${neis.server.enabled:false}
        name: neis
        version: @neis.version@  # Maven resource filtering (Boot @..@ delimiter) — follows the pom neis.version property
        type: sync
        protocol: STREAMABLE
        instructions: >-
          NEIS (News and Events Information System): curated tools to
          register addresses, fetch news/events and read stored items,
          content artifacts and run results. AI services are NOT exposed.
        # the streamable-http endpoint defaults to /mcp (verified in the
        # autoconfigure jar bytecode) — no key needed
        # US-18.3 review finding: the @McpTool annotation scanner must
        # follow the SAME gate — otherwise its BeanPostProcessor loads
        # in every CLI run and would silently scan any future ungated
        # @McpTool bean
        annotation-scanner:
          enabled: ${neis.server.enabled:false}
  main:
    # US-18.6 (issue #121): the SERVER run mode gate. CLI mode (the
    # default) runs with NO web server: one-shot invocations must exit
    # exactly as before (a started Tomcat would hold the JVM alive
    # forever). server.sh boots server mode with
    # --spring.main.web-application-type=servlet --neis.server.enabled=true;
    # the REST/MCP remote adapters only exist in server mode.
    web-application-type: none
  datasource:
    # Persistence layer (US-02, epic #2): SQLite3 is the database of the
    # first iteration. The database file location is externalized via
    # neis.db.path (relaxed binding env override NEIS_DB_PATH).
    url: jdbc:sqlite:${neis.db.path:./neis.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # sqlite-jdbc defaults PRAGMA foreign_keys to OFF: without this the
      # schema's REFERENCES constraints are decorative (review finding,
      # 2026-11-11). Pragmas are per connection — passed as connection
      # properties (verified against sqlite-jdbc: a multi-statement
      # connection-init-sql does NOT apply; properties do).
      data-source-properties:
        foreign_keys: true
        # US-18.4 (found live): SQLITE_BUSY on the job runner's reads
        # while an execution writes — the driver's default 3s budget
        # expired under real chain-write load. 15s turns the transient
        # contention into a wait instead of a FAILED job.
        busy_timeout: 15000
  jpa:
    # The schema is owned by the migrations (US-02.3), never by Hibernate:
    # no implicit DDL from the ORM.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    # Schema evolution is migration-driven (US-02.3): the ORM never
    # generates DDL (ddl-auto none) and an applied migration is never
    # edited — schema changes ship as new Vn files in db/migration.
    locations: classpath:db/migration

logging:
  # US-15.2 (issue #60): operations land in a rolling file OUTSIDE the
  # database, independent of the console (the run kit's raw log
  # redirect). Level is configurable per logger below and via
  # overrides; rotation is size- and time-based with retention caps.
  file:
    name: ${neis.log.path:./logs/neis.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${neis.log.path:./logs/neis.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
  level:
    # Debug visibility for what the shell is doing (command registration,
    # runner selection, command execution).
    org.springframework.shell: debug
    # Explicit decision-level traces of the AI component (US-01.3): what
    # the AI decided, what was stored/rejected/skipped, and one line per
    # call (model, sizes, elapsed). Protocol bodies are never logged.
    es.jllopez.neis: info

neis:
  name: NEIS
  description: News and Events Information System
  server:
    # US-18.6 (issue #121): the remote-adapter gate, default OFF. Only
    # server.sh (or an explicit override) turns it on, together with
    # spring.main.web-application-type=servlet — the two must agree
    # (ServerModeConfig fails the boot on a mismatch).
    enabled: false
  # The SSAFP pipeline's work dir (ex issue #90): the content root where
  # the SCRAPE/SIMPLIFY artifacts and the selector store live (US-11).
  core:
    work-dir: ./core-work
  scrape:
    # Which connector serves the WEBSCRAPE step (US-06.1): 'static' (the
    # bundled HTML5 fixtures of the issue #62 seed addresses, default —
    # offline runs need no network) or 'live' (real HTTP fetch over
    # java.net.http HttpClient with jsoup HTML5 normalization). An
    # unknown value fails the boot instead of silently falling back.
    connector: static
    # Per-request timeout of the live fetch.
    timeout-seconds: 20
    # Safety cap of the live fetch's response body: the fetch streams
    # and aborts mid-transfer once the cap is exceeded (and refuses
    # before reading when Content-Length already exceeds it), so a
    # misbehaving registered address cannot buffer unbounded bytes into
    # memory (review finding 2026-11-14).
    max-bytes: 10485760
    clearing:
      # Page-specific obstructing selectors (US-06.7, issue #75): CSS
      # selectors of the elements a WEBSCRAPE run removes from the
      # captured HTML5 (popups, banners, ads the generic clearing rules
      # miss), per address or kind-wide — the selector model (US-12),
      # validated at boot (a selector that does not parse fails the
      # boot, US-12.3). The generic clearing rules (declared overlays,
      # consent/cookie vocabulary, ad containers) always apply on top.
      selectors: []
#      - address: ADDR-005
#        kind: event
#        selector: "#site-overlay"
#      - kind: news
#        selector: ".promo-popup"
  address:
    verification:
      # Address reachability check (US-04.2): per-request timeout of the
      # verification HTTP call.
      timeout-seconds: 10
  selectors:
    # Preconfigured CSS selectors (US-12.1, issue #46): per address and
    # listing kind, consulted by ANALYZE before the AI; a validated one
    # is persisted to the selector store with discoveredBy=preconfigured.
    # A specific (address + kind) entry wins over a kind-wide default.
    # Note: once persisted, the stored fast path keeps winning while the
    # stored selector still extracts items — a config change only takes
    # effect after the stored selector goes stale (US-12.1 review
    # finding 2026-11-14).
    preconfigured: []
#      - address: ADDR-005
#        kind: event
#        selector: "div.view-content > article"
#      - kind: news
#        selector: "ul.news-list li"
  extraction:
    # Default cap on extracted items (US-12.5, issue #68): optional —
    # absent means no limit; the WEBSCRAPE step's own max-items
    # parameter (1..10000) overrides it per task. A present value must
    # be a positive integer or the boot fails.
#    max-items: 100
  execution:
    # How long the CLI --wait option blocks for an asynchronous run.
    await-timeout-seconds: 300
  schedule:
    # Configurable schedules (US-05.2): which task runs over which
    # address, and when (Spring 6-field cron). Defined here, never
    # hard-coded; a schedule entry fires the asynchronous executor and
    # leaves an execution record like a manual run. Empty by default.
    entries: []
#      - name: hourly-news-scrape
#        task: WEBSCRAPE
#        address: ADDR-001
#        cron: "0 5 * * * *"
  ai:
    # AI provider management (US-15.3, issue #66): exactly one provider
    # is accepted in this iteration — MeliousAI (the same provider the
    # Hermes agent uses; owner decision 2026-11-11). Configuring any
    # other provider name is refused at boot until a new owner decision
    # adds it. The API key NEVER lives in configuration or the
    # repository: api-key-ref names the environment variable holding
    # the key (resolved at connector construction); a plain-text
    # neis.ai.api-key value that does not match the environment key is
    # rejected at boot.
    enabled: false
    provider: melious
    base-url: https://api.melious.ai/v1
    api-key-ref: MELIOUS_API_KEY
    # Default model, same as the Hermes agent's.
    model: glm-5.3-flash
