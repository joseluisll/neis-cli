spring:
  application:
    name: neis
  datasource:
    # Persistence layer (US-02, epic #2): SQLite3 is the database of the
    # first iteration. The database file location is externalized via
    # neis.db.path (relaxed binding env override NEIS_DB_PATH).
    url: jdbc:sqlite:${neis.db.path:./neis.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # sqlite-jdbc defaults PRAGMA foreign_keys to OFF: without this the
      # schema's REFERENCES constraints are decorative (review finding,
      # 2026-11-11). The pragma is per connection; Hikari runs the init
      # SQL on every pooled connection.
      connection-init-sql: PRAGMA foreign_keys=ON
  jpa:
    # The schema is owned by the migrations (US-02.3), never by Hibernate:
    # no implicit DDL from the ORM.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    # Schema evolution is migration-driven (US-02.3): the ORM never
    # generates DDL (ddl-auto none) and an applied migration is never
    # edited — schema changes ship as new Vn files in db/migration.
    locations: classpath:db/migration

logging:
  level:
    # Debug visibility for what the shell is doing (command registration,
    # runner selection, command execution).
    org.springframework.shell: debug
    # Explicit decision-level traces of the AI component (US-01.3): what
    # the AI decided, what was stored/rejected/skipped, and one line per
    # call (model, sizes, elapsed). Protocol bodies are never logged.
    es.jllopez.neis: info

neis:
  name: NEIS
  description: News and Events Information System
  # MVP static chain (issue #90): where the SCRAPE/SIMPLIFY artifacts are
  # written as real HTML5 files.
  mvp:
    work-dir: ./neis-mvp
  address:
    verification:
      # Address reachability check (US-04.2): per-request timeout of the
      # verification HTTP call.
      timeout-seconds: 10
  ai:
    # AI integration point (US-01.3) using the same MeliousAI provider as
    # the Hermes agent (owner decision 2026-11-11; provider management is
    # US-15.3). The API key never lives in this repository: it is read
    # from the MELIOUS_API_KEY environment variable (same variable the
    # Hermes setup uses, in ~/.hermes/.env).
    enabled: false
    base-url: https://api.melious.ai/v1
    api-key: ${MELIOUS_API_KEY:}
    # Default model, same as the Hermes agent's.
    model: glm-5.3-flash
