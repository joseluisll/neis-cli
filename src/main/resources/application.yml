spring:
  application:
    name: neis

logging:
  level:
    # Debug visibility for what the shell is doing (command registration,
    # runner selection, command execution).
    org.springframework.shell: debug

neis:
  name: NEIS
  description: News and Events Information System
  ai:
    # AI integration point (US-01.3). Active only when enabled=true and
    # an API key is provided; the app boots and tests run without one.
    enabled: false
    # Default provider is MeliousAI (OpenAI-compatible), owner stack
    # decision in issue #63; provider management is US-15.3.
    base-url: https://api.melious.ai
    api-key: ''
    # Optional model override; provider default when empty.
    model: ''
