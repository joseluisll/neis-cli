spring:
  application:
    name: neis
  datasource:
    # Persistence layer (US-02, epic #2): SQLite3 is the database of the
    # first iteration. The database file location is externalized via
    # neis.db.path (relaxed binding env override NEIS_DB_PATH).
    url: jdbc:sqlite:${neis.db.path:./neis.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      # sqlite-jdbc defaults PRAGMA foreign_keys to OFF: without this the
      # schema's REFERENCES constraints are decorative (review finding,
      # 2026-11-11). The pragma is per connection; Hikari runs the init
      # SQL on every pooled connection.
      connection-init-sql: PRAGMA foreign_keys=ON
  jpa:
    # The schema is owned by the migrations (US-02.3), never by Hibernate:
    # no implicit DDL from the ORM.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    # Schema evolution is migration-driven (US-02.3): the ORM never
    # generates DDL (ddl-auto none) and an applied migration is never
    # edited — schema changes ship as new Vn files in db/migration.
    locations: classpath:db/migration

logging:
  level:
    # Debug visibility for what the shell is doing (command registration,
    # runner selection, command execution).
    org.springframework.shell: debug
    # Explicit decision-level traces of the AI component (US-01.3): what
    # the AI decided, what was stored/rejected/skipped, and one line per
    # call (model, sizes, elapsed). Protocol bodies are never logged.
    es.jllopez.neis: info

neis:
  name: NEIS
  description: News and Events Information System
  # The SSAFP pipeline's work dir (ex issue #90): the content root where
  # the SCRAPE/SIMPLIFY artifacts and the selector store live (US-11).
  core:
    work-dir: ./core-work
  scrape:
    # Which connector serves the WEBSCRAPE step (US-06.1): 'static' (the
    # bundled HTML5 fixtures of the issue #62 seed addresses, default —
    # offline runs need no network) or 'live' (real HTTP fetch over
    # java.net.http HttpClient with jsoup HTML5 normalization). An
    # unknown value fails the boot instead of silently falling back.
    connector: static
    # Per-request timeout of the live fetch.
    timeout-seconds: 20
    # Safety cap of the live fetch's response body: the fetch streams
    # and aborts mid-transfer once the cap is exceeded (and refuses
    # before reading when Content-Length already exceeds it), so a
    # misbehaving registered address cannot buffer unbounded bytes into
    # memory (review finding 2026-11-14).
    max-bytes: 10485760
  address:
    verification:
      # Address reachability check (US-04.2): per-request timeout of the
      # verification HTTP call.
      timeout-seconds: 10
  selectors:
    # Preconfigured CSS selectors (US-12.1, issue #46): per address and
    # listing kind, consulted by ANALYZE before the AI; a validated one
    # is persisted to the selector store with discoveredBy=preconfigured.
    # A specific (address + kind) entry wins over a kind-wide default.
    # Note: once persisted, the stored fast path keeps winning while the
    # stored selector still extracts items — a config change only takes
    # effect after the stored selector goes stale (US-12.1 review
    # finding 2026-11-14).
    preconfigured: []
#      - address: ADDR-005
#        kind: event
#        selector: "div.view-content > article"
#      - kind: news
#        selector: "ul.news-list li"
  execution:
    # How long the CLI --wait option blocks for an asynchronous run.
    await-timeout-seconds: 300
  schedule:
    # Configurable schedules (US-05.2): which task runs over which
    # address, and when (Spring 6-field cron). Defined here, never
    # hard-coded; a schedule entry fires the asynchronous executor and
    # leaves an execution record like a manual run. Empty by default.
    entries: []
#      - name: hourly-news-scrape
#        task: WEBSCRAPE
#        address: ADDR-001
#        cron: "0 5 * * * *"
  ai:
    # AI integration point (US-01.3) using the same MeliousAI provider as
    # the Hermes agent (owner decision 2026-11-11; provider management is
    # US-15.3). The API key never lives in this repository: it is read
    # from the MELIOUS_API_KEY environment variable (same variable the
    # Hermes setup uses, in ~/.hermes/.env).
    enabled: false
    base-url: https://api.melious.ai/v1
    api-key: ${MELIOUS_API_KEY:}
    # Default model, same as the Hermes agent's.
    model: glm-5.3-flash
