# Test context properties.
# The test JVM has no interactive terminal: if the JLine shell runner
# starts, it blocks on stdin forever and the surefire phase hangs.
# Keep the full Spring Shell wiring (commands, registry) but never enter
# the interactive loop during tests. NOTE: JLineShellAutoConfiguration and
# TerminalUIAutoConfiguration cannot be excluded via
# spring.autoconfigure.exclude (they are not registered auto-configuration
# classes; only SpringShellAutoConfiguration is).
spring.shell.interactive.enabled=false
# JLine history would otherwise create neis.log in the project root.
spring.shell.history.enabled=false
# Tests run against a shared-cache named in-memory SQLite database: every
# pooled connection sees the same database (a plain ::memory: gives each
# connection its own empty one — review finding, 2026-11-11), so Flyway
# migrations and repository access stay consistent. The database lives
# only while the pool holds connections; no neis.db lands in the project
# root during mvn test. Repository-backed tests may still pin a temporary
# file for full isolation (see SchemaRoundTripTest).
spring.datasource.url=jdbc:sqlite:file:neis-test?mode=memory&cache=shared
